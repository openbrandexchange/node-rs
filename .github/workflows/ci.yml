name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked

  crates:
    # The obx-* library crates must stay publishable on their own (they are
    # not published from CI; a maintainer decides when).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Docs (warnings are errors)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --exclude node-rs --no-deps --locked
      - name: cargo publish --dry-run
        run: cargo publish --workspace --exclude node-rs --dry-run --locked
      - uses: dtolnay/rust-toolchain@1.88
      - name: MSRV 1.88 (library crates)
        run: cargo +1.88 check --workspace --exclude node-rs --locked

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build node-rs
        run: cargo build --locked
      - name: Install obx-conformance (obx-go main)
        run: go install github.com/openbrandexchange/obx-go/cmd/obx-conformance@main
      - name: Conformance (all profiles)
        run: scripts/conformance.sh all
      - name: Conformance (security, with the rate-limit test)
        run: CONFORMANCE_ARGS=--rate-limit-test REPORT=conformance-rate-limit.json CONFORMANCE_PORT=18432 scripts/conformance.sh security
      - name: Report in the job summary
        if: always()
        run: |
          if [ -f conformance-report.json ]; then
            "$(go env GOPATH)/bin/obx-conformance" report --format markdown conformance-report.json >> "$GITHUB_STEP_SUMMARY" || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-report
          path: conformance-report.json

  node-go-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build node-rs
        run: cargo build --locked
      - name: Build node-go (main)
        run: |
          git clone --depth 1 https://github.com/openbrandexchange/node-go /tmp/node-go
          (cd /tmp/node-go && go build -o /tmp/node-go-bin .)
      - name: node-rs runs on a node-go data folder
        run: python3 -I scripts/test-node-go-data.py /tmp/node-go-bin target/debug/node-rs

  node-go-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: obx
          POSTGRES_PASSWORD: obx
          POSTGRES_DB: obx
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U obx" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build node-rs
        run: cargo build --locked
      - name: Build node-go (main)
        run: |
          git clone --depth 1 https://github.com/openbrandexchange/node-go /tmp/node-go
          (cd /tmp/node-go && go build -o /tmp/node-go-bin .)
      - name: node-go on PostgreSQL, copied with node-rs import-postgres
        run: python3 -I scripts/test-node-go-data.py /tmp/node-go-bin target/debug/node-rs "postgres://obx:obx@127.0.0.1:5432/obx?sslmode=disable"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t node-rs:ci .
      - name: Smoke test
        run: |
          docker run -d --name node-rs-ci -p 8080:8080 -e OBX_PUBLIC_URL=http://localhost:8080 node-rs:ci
          for i in $(seq 1 50); do curl -fsS http://localhost:8080/healthz && break; sleep 0.2; done
          curl -fsS http://localhost:8080/admin/api/setup | grep -q '"required":true'
          docker logs node-rs-ci 2>&1 | grep -q 'setup code'

  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: sshd for the SFTP source
        run: sudo apt-get install -y --no-install-recommends openssh-server
      - name: Build node-rs
        run: cargo build --locked
      - name: Scheduled imports (https, SFTP, S3)
        run: python3 -I scripts/test-sources.py target/debug/node-rs

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Licences, advisories, bans and sources (deny.toml)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --workspace
