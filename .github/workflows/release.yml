# Runs only for a version tag (v*): Linux binaries and the Docker image.
name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: |
          mkdir pkg && cp target/release/node-rs LICENSE NOTICE README.md pkg/
          tar czf node-rs-${{ matrix.arch }}-linux.tar.gz -C pkg node-rs LICENSE NOTICE README.md
          sha256sum node-rs-${{ matrix.arch }}-linux.tar.gz > node-rs-${{ matrix.arch }}-linux.tar.gz.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            node-rs-${{ matrix.arch }}-linux.tar.gz
            node-rs-${{ matrix.arch }}-linux.tar.gz.sha256

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "full=$v" >> "$GITHUB_OUTPUT"
          echo "minor=${v%.*}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/openbrandexchange/node-rs:${{ steps.v.outputs.full }}
            ghcr.io/openbrandexchange/node-rs:${{ steps.v.outputs.minor }}
            ghcr.io/openbrandexchange/node-rs:latest
