[package]
name = "node-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
description = "Open Brand Exchange reference node: publish as a brand, subscribe as a retailer. One binary."
repository = "https://github.com/openbrandexchange/node-rs"
publish = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "time", "sync"] }
axum = "0.8"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
