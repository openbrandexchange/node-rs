[package]
name = "obx-format"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "The OBX canonical import format (CSV, image names, materials, care), vocabularies and GTINs"
publish = false

[lib]
name = "obx_format"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
csv = "1.3"
regex = "1"
unicode-normalization = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
quick-xml = "0.38"
zip = { version = "2", default-features = false, features = ["deflate"] }

[lints.clippy]
collapsible_if = "allow"

[lints.rust]
unsafe_code = "forbid"
