[package]
name = "obx-types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["obx", "open-brand-exchange", "product-data", "fashion", "pim"]
categories = ["data-structures", "encoding"]
description = "Open Brand Exchange (OBX) types: objects, problem documents, ids, GTINs, vocabularies and JSON Schema validation"
readme = "README.md"
include = ["src/**", "spec/**", "tests/**", "README.md", "LICENSE"]

[features]
default = ["validate"]
## Validation against the spec's JSON Schemas (embedded).
validate = ["dep:jsonschema", "dep:rust-embed"]
## `IntoResponse` for `Problem` (axum 0.8).
axum = ["dep:axum"]

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
rand = "0.9"
tracing = "0.1"
jsonschema = { version = "0.33", default-features = false, optional = true }
rust-embed = { version = "8", optional = true }
axum = { version = "0.8", default-features = false, optional = true }

[package.metadata.docs.rs]
all-features = true
