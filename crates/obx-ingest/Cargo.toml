[package]
name = "obx-ingest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["obx", "open-brand-exchange", "csv", "import", "upload"]
categories = ["parser-implementations", "encoding"]
description = "Open Brand Exchange (OBX) ingest: the canonical import format (CSV, image names, materials, care, article data) and resumable uploads"
readme = "README.md"

[lib]
name = "obx_ingest"

[lints]
workspace = true

[dependencies]
obx-types = { version = "0.1.0", path = "../obx-types", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
csv = "1.3"
regex = "1"
unicode-normalization = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
quick-xml = "0.38"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
